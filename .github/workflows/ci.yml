name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build the real Olist database
        run: python setup_data.py
      - name: Unit + data tests
        run: pytest -q
      - name: Benchmark self-check (correct SQL must score 100%)
        run: python run_benchmark.py --provider gold --mode raw
